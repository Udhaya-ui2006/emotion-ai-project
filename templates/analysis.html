<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Emotion Analysis - EmotionAI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #0f172a,
                #1e1b4b
            );
            color: white;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(0, 0, 0, 0.25);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #a78bfa;
        }

        .home {
            color: white;
            text-decoration: none;
        }

        .home:hover {
            color: #a78bfa;
        }

        .container {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .analysis-box {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .upload-area {
            border: 2px dashed #8b5cf6;
            border-radius: 20px;
            padding: 35px 20px;
            margin-bottom: 25px;
            background: rgba(124, 58, 237, 0.08);
        }

        .mic {
            font-size: 65px;
            margin-bottom: 15px;
        }

        .upload-area h2 {
            color: #c4b5fd;
            margin-bottom: 10px;
        }

        .upload-area p {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        input[type="file"] {
            display: none;
        }

        .choose-btn {
            display: inline-block;
            padding: 13px 25px;
            background: #7c3aed;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .choose-btn:hover {
            background: #6d28d9;
        }

        #file-name {
            margin-top: 15px;
            color: #c4b5fd;
            min-height: 20px;
        }

        .analyze-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #7c3aed;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .analyze-btn:hover {
            background: #6d28d9;
        }

        .analyze-btn:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .info {
            margin-top: 25px;
            color: #94a3b8;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .analysis-box {
                padding: 25px 18px;
            }

            h1 {
                font-size: 28px;
            }

        }

    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            EmotionAI
        </div>

        <a href="/" class="home">
            ← Home
        </a>

    </nav>


    <div class="container">

        <div class="analysis-box">

            <h1>🎙️ Emotion Analysis</h1>

            <p class="subtitle">
                Upload your voice recording and our AI
                will analyze the emotions in your speech.
            </p>


            <form action="/upload"
                  method="POST"
                  enctype="multipart/form-data">

                <div class="upload-area">

                    <div class="mic">
                        🎤
                    </div>

                    <h2>
                        Upload Audio
                    </h2>

                    <p>
                        Supported formats: WAV, MP3, OGG
                    </p>


                    <label for="audio"
                           class="choose-btn">
                        📁 Choose Audio
                    </label>

                    <input
                        type="file"
                        id="audio"
                        name="audio"
                        accept="audio/*"
                        required
                    >

                    <div id="file-name">
                    </div>

                </div>


                <button
                    type="submit"
                    class="analyze-btn"
                    id="analyzeBtn">

                    🔍 Analyze Emotion

                </button>

            </form>


            <div class="info">

                🔒 Your audio is analyzed locally
                by the AI emotion model.

            </div>

        </div>

    </div>


    <script>

        const audioInput =
            document.getElementById("audio");

        const fileName =
            document.getElementById("file-name");

        const analyzeBtn =
            document.getElementById("analyzeBtn");


        audioInput.addEventListener(
            "change",
            function() {

                if (this.files.length > 0) {

                    fileName.textContent =
                        "Selected: " +
                        this.files[0].name;

                    analyzeBtn.disabled = false;

                }

            }
        );

    </script>

</body>

</html>
