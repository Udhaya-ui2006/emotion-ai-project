<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emotion Analysis</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .section {
            border: 2px dashed #bbb;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            margin: 8px;
        }

        #startBtn {
            background: #22c55e;
            color: white;
        }

        #stopBtn {
            background: #ef4444;
            color: white;
        }

        #analyzeBtn {
            background: #2563eb;
            color: white;
            width: 220px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        input[type="file"] {
            margin: 20px 0;
        }

        audio {
            width: 100%;
            margin-top: 15px;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>AI Emotion Analysis</h1>

        <p class="subtitle">
            Record your voice or upload an audio file to detect emotion.
        </p>

        <!-- Microphone Recording -->
        <div class="section">

            <h2>🎙️ Record Your Voice</h2>

            <button id="startBtn">Start Recording</button>
            <button id="stopBtn" disabled>Stop Recording</button>

            <div id="status">
                Click Start Recording to begin.
            </div>

            <audio id="audioPreview" controls style="display:none;"></audio>

        </div>

        <!-- File Upload -->
        <div class="section">

            <h2>📁 Upload Audio</h2>

            <form id="uploadForm">

                <input
                    type="file"
                    id="audioFile"
                    name="audio"
                    accept="audio/*"
                >

                <br>

                <button type="submit" id="analyzeBtn">
                    Analyze Emotion
                </button>

            </form>

        </div>

        <a href="/" class="back">← Back to Home</a>

    </div>

</div>


<script>

let mediaRecorder;
let audioChunks = [];
let recordedBlob = null;

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const audioPreview = document.getElementById("audioPreview");
const statusText = document.getElementById("status");
const uploadForm = document.getElementById("uploadForm");
const audioFile = document.getElementById("audioFile");


/* =========================
   START RECORDING
========================= */

startBtn.addEventListener("click", async () => {

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        audioChunks = [];

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = event => {

            if (event.data.size > 0) {
                audioChunks.push(event.data);
            }

        };

        mediaRecorder.onstop = () => {

            recordedBlob = new Blob(
                audioChunks,
                { type: "audio/webm" }
            );

            const audioURL = URL.createObjectURL(recordedBlob);

            audioPreview.src = audioURL;
            audioPreview.style.display = "block";

            statusText.innerText =
                "Recording completed. Click Analyze Emotion.";

            stream.getTracks().forEach(track => track.stop());

        };

        mediaRecorder.start();

        startBtn.disabled = true;
        stopBtn.disabled = false;

        statusText.innerText = "🎙️ Recording...";

    }

    catch (error) {

        console.error(error);

        statusText.innerText =
            "Microphone permission denied or unavailable.";

    }

});


/* =========================
   STOP RECORDING
========================= */

stopBtn.addEventListener("click", () => {

    if (mediaRecorder && mediaRecorder.state !== "inactive") {

        mediaRecorder.stop();

        startBtn.disabled = false;
        stopBtn.disabled = true;

    }

});


/* =========================
   FILE UPLOAD / RECORDING
========================= */

uploadForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const formData = new FormData();

    /*
       If user selected an audio file,
       use that file.
    */

    if (audioFile.files.length > 0) {

        formData.append(
            "audio",
            audioFile.files[0]
        );

    }

    /*
       Otherwise use recorded voice.
    */

    else if (recordedBlob) {

        formData.append(
            "audio",
            recordedBlob,
            "recorded_voice.webm"
        );

    }

    else {

        alert("Please record your voice or select an audio file.");
        return;

    }


    statusText.innerText =
        "🤖 AI is analyzing your voice...";


    try {

        const response = await fetch(
            "/upload",
            {
                method: "POST",
                body: formData
            }
        );


        if (!response.ok) {

            throw new Error(
                "Server error: " + response.status
            );

        }


        const result = await response.text();

        /*
           Flask returns the result page.
        */

        document.open();
        document.write(result);
        document.close();

    }

    catch (error) {

        console.error(error);

        statusText.innerText =
            "Error analyzing audio: " + error.message;

    }

});

</script>

</body>
</html>
